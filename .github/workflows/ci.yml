name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build

      # No simulator is booted on the runner. Simulator-dependent tests are guarded by
      # SIMPROBE_LIVE and skip themselves, so this stays green (PRD A5).
      - name: Test with coverage
        run: swift test --enable-code-coverage

      # The profile from the step above, filtered to this repository's own sources: the
      # ArgumentParser checkout it also carries would otherwise decide the number.
      - name: Coverage floor
        run: ./scripts/coverage-check.sh

      - name: Lint formatting
        run: swift format lint --strict --recursive Sources Tests

  hygiene:
    name: Hygiene
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Public-repo hygiene
        run: ./scripts/hygiene-check.sh

      # Both suites run on macOS's system bash 3.2 on purpose: the bench library
      # targets it, and a newer bash on PATH would hide a 3.2 incompatibility.
      - name: Bench library tests
        run: /bin/bash bench/lib/test.sh

      # Dry run: the flows are executed end to end with every measured command
      # recorded instead of run, so no simulator, no agent-device and no Xcode
      # are involved and the runner stays green without a booted device.
      - name: Bench flow smoke tests
        run: /bin/bash bench/flows/test.sh
